[project]
name = 'ai-consultant-service'
version = '0.1.0'
description = 'FastAPI asynchronous microservice for AI LLM Consultant (GPT-4o-mini)'
requires-python = '>=3.11'
dependencies = [
    'fastapi==0.111.0',
    'uvicorn==0.30.1',
    'openai>=1.50.0',
    'python-dotenv==1.0.1',
    'pydantic==2.13.4',
    'pydantic_core==2.46.4',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "pytest-mock",
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
